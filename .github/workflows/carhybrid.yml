name: carhybrid
run-name: "Whole-car hybrid: ${{ github.event.inputs.batch || 'request file' }}"

# carhybrid/DESIGN.md. Each case builds one whole car with the pinned evolution builder (another agent's branch
# claude/loving-keller-q72mvv at EVO_SHA, read only), adapts it to an OpenFOAM half car, and either scores it on the
# audit protocol ("score") or computes its coarse DAFoam gradient and maps it to stage 2's free-form numbers
# ("dafoam"). Launch: commit carhybrid/request.json on this branch.
# "fine_adjoint" (carhybrid/FINE_ADJOINT.md, job body carhybrid/fine_adjoint.sh): the score of frame k with its state
# kept, then DAFoam on that same mesh. Here only as plumbing tests on a coarse bg_div (a hosted runner has 16 GB); the
# production-mesh runs go to a 512 GB EC2 instance through the AWS CLI (carhybrid/aws/launch.sh, README there), which
# runs the same script. Batches named loop*: collect runs carhybrid/loop.py advance and dispatches the batch it writes.
on:
  push:
    branches: [claude/wizardly-brahmagupta-1edalc]
    paths: ["carhybrid/request.json"]
  workflow_dispatch:
    inputs:
      batch: { description: "key in carhybrid/request.json batches", required: false }

permissions: { contents: write }

env:
  EVO_SHA: e9c896b9774622eb53552db5b1e2d36d4108b5a1
  ADJ_SHA: 9ab9092debd0e0297b290d886bf45a765045448c
  PY_DEPS: scikit-learn==1.9.1 numpy==2.4.6 scipy==1.17.1 pandas pillow trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1 numba cadquery-ocp cma
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_ALLOW_RUN_AS_ROOT: "1"
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

jobs:
  init:
    runs-on: ubuntu-24.04
    outputs:
      cases: ${{ steps.r.outputs.cases }}
      batch: ${{ steps.r.outputs.batch }}
      domain: ${{ steps.r.outputs.domain }}
      bgdiv: ${{ steps.r.outputs.bgdiv }}
      skip: ${{ steps.r.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: r
        env: { I_BATCH: "${{ github.event.inputs.batch }}", EVENT: "${{ github.event_name }}" }
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          r = json.load(open("carhybrid/request.json"))
          b = os.environ.get("I_BATCH") or r["launch"]
          # a push launches only when it changed "launch": any other edit of request.json (adding a batch) must not
          # re-run the current launch batch (commit 9b41a11 re-launched all of P1 that way)
          skip = False
          if os.environ.get("EVENT") == "push":
              prev = subprocess.run(["git", "show", "HEAD~1:carhybrid/request.json"], capture_output=True, text=True)
              try:
                  skip = prev.returncode == 0 and json.loads(prev.stdout).get("launch") == r["launch"]
              except ValueError:
                  skip = False
          # a batch of production-mesh fine_adjoint cases runs on AWS (carhybrid/aws/launch.sh), never here
          cs = r["batches"][b]
          if cs and all(c.get("type") == "fine_adjoint" and float(c.get("bg_div") or r["bg_div"]) > 6 for c in cs):
              skip = True
          print("skip=" + ("true" if skip else "false"))
          print("cases=" + json.dumps(r["batches"][b] if not skip else [{"name": "none", "type": "none"}])); print("batch=" + b)
          print("domain=" + json.dumps(r["domain_m"])); print("bgdiv=" + str(r["bg_div"]))
          PY

  case:
    name: "${{ matrix.case.name }}"
    needs: init
    if: ${{ !cancelled() && needs.init.result == 'success' && needs.init.outputs.skip != 'true' }}
    # every case on a hosted runner (production-mesh fine_adjoint cases run on AWS: carhybrid/aws/launch.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        case: ${{ fromJSON(needs.init.outputs.cases) }}
    steps:
      - name: room (free disk, 10 GB swap)
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: mxnviir/stem-racing-evolution, ref: "${{ env.EVO_SHA }}", path: evo }
      - uses: actions/checkout@v4
        with: { repository: mxnviir/stem-racing-adjoint, ref: "${{ env.ADJ_SHA }}", path: adj }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with: { path: ~/ofdebs, key: openfoam2412-260127-noble-debs }
      - name: OpenFOAM v2412 + python deps
        timeout-minutes: 30
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] || [ ! -f /usr/lib/openfoam/openfoam2412/etc/bashrc ]; then
            (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; sleep 20; done) || true
            for i in 1 2 3 4 5 6; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
            bash adj/.github/scripts/install_openfoam.sh
          fi
          pip install $PY_DEPS
          python seedhybrid/patch_adj.py adj
          python evo_patches/apply.py evo                     # this branch's fixes to the pinned builder (evo_patches/README.md)
          case "${{ matrix.case.type }}" in dafoam|fine_adjoint) for i in 1 2 3; do docker pull -q dafoam/opt-packages:v5.1.1 && break; sleep 30; done;; esac
      - name: build the car (evolution builder) and adapt it for OpenFOAM
        timeout-minutes: 90
        env: { LAYOUT: "${{ matrix.case.layout }}", U: "${{ matrix.case.u || 'zero' }}", WING: "${{ matrix.case.wing || '' }}" }
        run: |
          mkdir -p out/${{ matrix.case.name }}
          rm -rf /tmp/car                                     # a self-hosted machine keeps /tmp between jobs
          set +e
          python -W ignore carhybrid/make_car.py evo "$LAYOUT" "$U" /tmp/car ${{ matrix.case.grid && format('--grid {0}', matrix.case.grid) || '' }} ${WING:+--wing "$WING"} > out/${{ matrix.case.name }}/make_car.log 2>&1
          RC=$?
          set -e
          tail -c 2500 out/${{ matrix.case.name }}/make_car.log
          cp /tmp/car/rec.json /tmp/car/cfd/adapt.json out/${{ matrix.case.name }}/ 2>/dev/null || true
          cp /tmp/car/evo/summary.json /tmp/car/evo/run_car.log /tmp/car/evo/report.md out/${{ matrix.case.name }}/ 2>/dev/null || true
          cp /tmp/car/evo/parts/assembly.json out/${{ matrix.case.name }}/assembly.json 2>/dev/null || true   # the part engines' own info (roots tried, why a support was not placed)
          echo "=== verdict"; python3 -c "import json; r=json.load(open('/tmp/car/rec.json')); print(json.dumps({k: r.get(k) for k in ('legal','failed','why','mass','build_s')}, default=float)[:1500])" || true
          # renders and the shape audit of every car built (owner 2026-11-28: renders of all; no extreme squareness or
          # hard-coded shapes)
          if [ -f /tmp/car/evo/body_half.stl ] && [ -f /tmp/car/evo/parts/assembly.json ]; then
            (cd evo && python -W ignore search/layout/layout_render.py /tmp/car/evo /tmp/render_full.png > /dev/null 2>&1) || echo "render failed"
            python3 -c "from PIL import Image; im = Image.open('/tmp/render_full.png'); im.thumbnail((1400, 1600)); im.save('out/${{ matrix.case.name }}/render.png', optimize=True)" 2>/dev/null || true
            python -W ignore carhybrid/shape_audit.py /tmp/car/evo out/${{ matrix.case.name }}/shape.json || echo "shape audit failed"
          fi
          if [ "${{ matrix.case.type }}" = "build" ]; then exit 0; fi       # build-only cases: the verdict is the result
          exit $RC
      - name: score (audit protocol; fresh wall-resolved mesh, production scheme, 1000 its)
        if: matrix.case.type == 'score'
        timeout-minutes: 300
        run: |
          source /usr/lib/openfoam/openfoam2412/etc/bashrc || true
          export GATE_DOMAIN_JSON='${{ needs.init.outputs.domain }}'
          python3 -c "import json; print(json.dumps({'name': '${{ matrix.case.name }}', 'design': 'folder:/tmp/car/cfd', 'k': ${{ matrix.case.k || 0 }}, 'bg_div': ${{ needs.init.outputs.bgdiv }}}))" > /tmp/case.json
          python -W ignore audit/run_case.py adj /tmp/case.json out/${{ matrix.case.name }} | tail -1
          echo "=== result"; cat out/${{ matrix.case.name }}/result.json | head -c 1500
          echo "=== prodcheck tail"; tail -c 3000 out/${{ matrix.case.name }}/prodcheck.log || true
      - name: DAFoam gradient (coarse steady state, discrete adjoint) and its map to the free-form numbers
        if: matrix.case.type == 'dafoam'
        timeout-minutes: 300
        working-directory: adj/research/sidepod_opt
        env: { U: "${{ matrix.case.u || 'zero' }}" }
        run: |
          source /usr/lib/openfoam/openfoam2412/etc/bashrc || true
          O=$GITHUB_WORKSPACE/out/${{ matrix.case.name }}
          export GATE_DOMAIN_JSON='${{ needs.init.outputs.domain }}' P2_BG_DIV=${{ needs.init.outputs.bgdiv }}
          GATE_RES=coarse GATE_RESULTS=/tmp/gr CFD_DIV_U="bounded Gauss upwind" \
            python -W ignore -u hybrid/coarse_state.py /tmp/car/cfd gate/refA_hyb 5000 $O/state.json 2>&1 | tail -3
          python dafoam/make_case.py --src gate/refA_hyb --out gate/dafoam_case --iters 300 | tail -1
          env DAF_ADJ=Krylov DAF_PC_FILL=0 DAF_PC_LEVEL=1 DAF_GMRES_ITERS=2000 DAF_GMRES_RESTART=200 \
            dafoam/run_docker.sh gate/dafoam_case 4 > $O/dafoam.out 2>&1 || true
          grep -E "DAFOAM|Killed|Maximum resident" $O/dafoam.out || tail -30 $O/dafoam.out
          cp gate/dafoam_case/dafoam_sens.npz gate/dafoam_case/dafoam_sens.json $O/ 2>/dev/null || { echo "no gradient"; exit 0; }
          cd $GITHUB_WORKSPACE
          python -W ignore carhybrid/grad.py evo /tmp/car/rec.json $O/dafoam_sens.npz "$U" $O/grad.json --body /tmp/car/evo ${{ matrix.case.d20 && format('--d20 {0}', matrix.case.d20) || '' }} || echo "grad mapping failed"
          cat $O/grad.json | head -c 1500 || true
      - name: fine adjoint (production-mesh score with its state kept -> DAFoam D and L on that state -> gradient)
        if: matrix.case.type == 'fine_adjoint'
        timeout-minutes: 320
        env:
          NAME: "${{ matrix.case.name }}"
          LAYOUT: "${{ matrix.case.layout }}"
          U: "${{ matrix.case.u || 'zero' }}"
          K: "${{ matrix.case.k || 0 }}"
          BG_DIV: "${{ matrix.case.bg_div || needs.init.outputs.bgdiv }}"
          GRID: "${{ matrix.case.grid || '' }}"
          NP: "${{ matrix.case.np || '' }}"
          SCORE_NP: "${{ matrix.case.score_np || 4 }}"
          GATE_DOMAIN_JSON: "${{ needs.init.outputs.domain }}"
          DAF_PRIMAL_ONLY: "${{ matrix.case.primal_only && '1' || '' }}"
          DAF_FUNCS: "${{ matrix.case.funcs || 'D,L' }}"
          DAF_PRIMAL_ITERS: "${{ matrix.case.daf_primal_iters || 300 }}"
          DAF_GMRES_TOL: "${{ matrix.case.gmres_tol || '1e-6' }}"
          DAF_GMRES_ITERS: "${{ matrix.case.gmres_iters || 6000 }}"   # coarse runs stopped at 2000 still falling (run 46137619748)
          DAF_GMRES_RESTART: "${{ matrix.case.gmres_restart || 200 }}"
          DAF_PC_FILL: "${{ matrix.case.pc_fill || 0 }}"
          DAF_PC_LEVEL: "${{ matrix.case.pc_level || 1 }}"
        run: |
          # a hosted runner has 16 GB: only plumbing tests on a coarse mesh here; production meshes run on AWS
          if python3 -c "import sys; sys.exit(0 if float('$BG_DIV') > 6 else 1)"; then
            echo "bg_div $BG_DIV is a production-size mesh: run this case on AWS (bash carhybrid/aws/launch.sh <batch>)"; exit 1
          fi
          source /usr/lib/openfoam/openfoam2412/etc/bashrc || true
          [ -z "$NP" ] && unset NP                             # default: every core of the machine
          bash carhybrid/fine_adjoint.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "out-${{ matrix.case.name }}", path: out/, retention-days: 60 }

  collect:
    needs: [init, case]
    if: ${{ !cancelled() && needs.init.result == 'success' && needs.init.outputs.skip != 'true' }}       # a cancelled run commits and dispatches nothing
    runs-on: ubuntu-24.04
    permissions: { contents: write, actions: write }        # actions: the loop hook dispatches the next batch
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", merge-multiple: true, path: /tmp/res }
      - name: commit the results (json, logs; no meshes)
        run: |
          R=carhybrid/results/${{ needs.init.outputs.batch }}
          mkdir -p $R
          for d in /tmp/res/*/; do n=$(basename $d); mkdir -p $R/$n
            find $d -maxdepth 1 \( -name "*.json" -o -name "*.log" -o -name "*.out" -o -name "*.npz" -o -name "*.md" -o -name "*.png" \) -size -5M -exec cp {} $R/$n/ \;
            find $d -maxdepth 1 -name "dafoam_sens.npz" -size -90M -exec cp {} $R/$n/ \;   # fine-mesh sensitivities are larger
          done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carhybrid/results
          git commit -m "carhybrid ${{ needs.init.outputs.batch }}: results (run ${{ github.run_id }})" || true
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*10)); done
      # the loop hook (batches named loop*): loop.py advance judges the stage from the committed results (it needs the
      # evolution race model: the builder checkout at EVO_SHA with this branch's patches) and writes the next stage
      - uses: actions/checkout@v4
        if: startsWith(needs.init.outputs.batch, 'loop') || startsWith(needs.init.outputs.batch, 'bo_')
        with: { repository: mxnviir/stem-racing-evolution, ref: "${{ env.EVO_SHA }}", path: evo }
      - uses: actions/setup-python@v5
        if: startsWith(needs.init.outputs.batch, 'loop') || startsWith(needs.init.outputs.batch, 'bo_')
        with: { python-version: "3.11" }
      # batches loop*: carhybrid/loop.py (P2F); batches bo_*: carhybrid/bo.py (P3, the stage-1 layout search)
      - name: loop hook (carhybrid/loop.py or bo.py advance; dispatch the batch it writes)
        if: startsWith(needs.init.outputs.batch, 'loop') || startsWith(needs.init.outputs.batch, 'bo_')
        timeout-minutes: 40
        env: { GH_TOKEN: "${{ github.token }}", CARHYBRID_EVO: evo }
        run: |
          (for i in 1 2 3; do timeout 90 sudo apt-get update -q && break; sleep 20; done) || true
          for i in 1 2 3; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 30; done
          pip install -q $PY_DEPS
          python evo_patches/apply.py evo
          echo "evo/" >> .git/info/exclude                     # never committed
          R=carhybrid/results/${{ needs.init.outputs.batch }}
          set +e
          case "${{ needs.init.outputs.batch }}" in bo_*) DRV=carhybrid/bo.py;; *) DRV=carhybrid/loop.py;; esac
          python $DRV advance $R ${{ github.run_id }} --evo evo
          RC=$?
          set -e
          # 0 = next stage written (dispatch request.json's launch); 3 = the loop stopped (nothing to dispatch);
          # anything else (2 = refused / error) fails this job
          if [ $RC -eq 3 ]; then echo "$DRV: stopped, no further batch"; STOPPED=1; elif [ $RC -ne 0 ]; then echo "$DRV advance FAILED (exit $RC)"; exit 1; fi
          if [ -n "${STOPPED:-}" ]; then
            git add carhybrid; git commit -m "carhybrid loop: stopped after ${{ needs.init.outputs.batch }} (run ${{ github.run_id }})" || true
            for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*10)); done
            exit 0
          fi
          NEXT=$(python3 -c "import json; print(json.load(open('carhybrid/request.json'))['launch'])")
          python3 -c "import json, sys; r = json.load(open('carhybrid/request.json')); sys.exit(0 if sys.argv[1] in r['batches'] else 1)" "$NEXT" \
            || { echo "loop.py wrote launch=$NEXT but no such batch"; exit 1; }
          git add carhybrid
          git commit -m "carhybrid loop: advance after ${{ needs.init.outputs.batch }} (run ${{ github.run_id }}), next $NEXT" || true
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && PUSHED=1 && break; sleep $((i*10)); done
          [ "${PUSHED:-}" = 1 ] || { echo "push failed: not dispatching $NEXT"; exit 1; }
          gh workflow run carhybrid.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }} -f batch="$NEXT"
          echo "dispatched batch $NEXT"
